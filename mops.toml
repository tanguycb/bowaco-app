[package]
name = "bowaco"
version = "0.1.0"

[canisters.backend]
main = "src/backend/main.mo"

[canisters.backend.migrations]
chain = "src/backend/migrations"
check-limit = 1

[canisters.backend.check-stable]
path = "src/backend/.most/backend.most"

[dependencies]
core = "2.6.2"
sha2 = "0.2.5"
caffeineai-object-storage = "1.1.1"
caffeineai-email = "0.1.1"
caffeineai-inference-client = "0.4.1"
caffeineai-mcp-server = "0.1.0"
jayson = "0.1.1"
caffeineai-http-endpoints = "0.1.0"

[toolchain]
moc = "1.13.0"
